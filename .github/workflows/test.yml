name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: VS Code extension (mock)
        shell: bash
        run: |
          node scripts/build-vscode.js
          H="$PWD/.testhome"
          HOME="$H" USERPROFILE="$H" PACR_HOME="$H/.pacr" PACR_NO_NOTIFY=1 node test/vscode-mock.js
